[project]
name = "glucofinity-ml"
version = "0.1.0"
description = "Reproducible offline ML training tools for the GlucoFinity educational prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3.0,<4",
]

[project.scripts]
glucofinity-train-meal-response = "glucofinity_ml.training:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["glucofinity_ml*"]
